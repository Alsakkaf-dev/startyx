<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>إعدادات النظام — أونيكس ERP | بتروسبيشل</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%233d4a5c'/%3E%3Ccircle cx='16' cy='16' r='4.2' fill='none' stroke='%23fff' stroke-width='1.8'/%3E%3Cpath d='M16 5.5v3M16 23.5v3M26.5 16h-3M8.5 16h-3M23.4 8.6l-2.1 2.1M10.7 21.3l-2.1 2.1M23.4 23.4l-2.1-2.1M10.7 10.7L8.6 8.6' stroke='%23fff' stroke-width='1.8' stroke-linecap='round'/%3E%3C/svg%3E">

<script>
(function () {
  try {
    var raw = localStorage.getItem("onyx.v1.themePref");
    var pref = raw ? JSON.parse(raw) : "system";
    var dark = pref === "dark" ||
      (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    var d = localStorage.getItem("onyx.v1.density");
    document.documentElement.setAttribute("data-density", d ? JSON.parse(d) : "comfortable");
  } catch (e) {}
})();
</script>

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/components.css">
<!-- هيكل لوحة الإعدادات — خاص بهذه الصفحة وحدها -->
<link rel="stylesheet" href="assets/css/settings.css">
</head>

<body>
<div class="cp" id="cp">

  <!-- ═══════════ الشريط العلوي ═══════════ -->
  <header class="cp__top">
    <div class="cp__brand">
      <div class="cp__mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.1"/>
          <path d="M12 3.6v2.5M12 17.9v2.5M20.4 12h-2.5M6.1 12H3.6M18.3 5.7l-1.7 1.7M7.4 16.6l-1.7 1.7M18.3 18.3l-1.7-1.7M7.4 7.4 5.7 5.7"/>
        </svg>
      </div>
      <div class="cp__brandtext">
        <h1>إعدادات النظام</h1>
        <span id="cpOrg"></span>
      </div>
    </div>

    <div class="cp__spacer"></div>

    <div class="cp__searchwrap">
      <svg class="cp__searchicon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input type="search" id="cpSearch" class="cp__searchinput" placeholder="ابحث في الإعدادات…"
             autocomplete="off" spellcheck="false" aria-label="بحث في كل الإعدادات">
      <span class="cp__searchcount" id="cpSearchCount" aria-live="polite"></span>
      <kbd class="cp__kbd">Ctrl K</kbd>
    </div>

    <div class="cp__spacer"></div>

    <button type="button" class="cp__iconbtn" id="cpTheme" aria-label="تبديل السمة"></button>
    <a class="cp__iconbtn cp__iconbtn--label" href="index.html#/home" title="العودة لشجرة الأنظمة">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
           stroke-linecap="round" stroke-linejoin="round"><path d="M14 6l-6 6 6 6"/></svg>
      <span>العودة للأنظمة</span>
    </a>
  </header>

  <!-- ═══════════ القائمة الجانبية (يمين) ═══════════ -->
  <nav class="cp__side" id="cpTabs" role="tablist" aria-orientation="vertical"
       aria-label="أقسام الإعدادات"></nav>

  <!-- ═══════════ المحتوى ═══════════ -->
  <main class="cp__main" id="cpMain">
    <div class="cp__inner" id="cpInner"></div>
  </main>

  <!-- ═══════════ شريط الحفظ والإنجاز ═══════════ -->
  <footer class="cp__bar" id="cpBar" data-dirty="0">
    <!-- مقياس الإنجاز: نسبة البنود المحسومة من ١٤٣ — محسوبة لا مخزّنة -->
    <div class="cp__progress" id="cpProgress">
      <div class="cp__progresstop">
        <b id="cpProgressPct">٠٪</b>
        <span id="cpProgressTxt">مكتمل</span>
      </div>
      <div class="cp__track"><div class="cp__fill" id="cpProgressFill"></div></div>
    </div>

    <div class="cp__barinfo" id="cpBarInfo"></div>

    <div class="cp__baractions">
      <button type="button" class="cp__btn" id="cpExport">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"
             stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4m0 11-4-4m4 4 4-4"/><path d="M5 19h14"/></svg>
        <span>نسخ الإعدادات</span>
      </button>
      <button type="button" class="cp__btn" id="cpDiscard">تراجع</button>
      <button type="button" class="cp__btn cp__btn--primary" id="cpSave">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
             stroke-linecap="round" stroke-linejoin="round"><path d="M20 6 9 17l-5-5"/></svg>
        <span>حفظ التغييرات</span>
      </button>
    </div>
  </footer>

</div>

<script src="assets/js/util.js"></script>
<script src="assets/js/store.js"></script>
<script src="assets/js/icons.js"></script>
<script src="assets/js/nav.js"></script>
<script src="assets/js/data.js"></script>
<script src="assets/js/mock.js"></script>
<script src="assets/js/links.js"></script>
<script src="assets/js/spec-rules.js"></script>
<script src="assets/js/index-data.js"></script>
<script src="assets/js/ui.js"></script>
<script src="assets/js/settings-schema.js"></script>
<script src="assets/js/settings.js"></script>
</body>
</html>
