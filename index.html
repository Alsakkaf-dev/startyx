<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ffffff">
<title>أونيكس ERP — بتروسبيشل | مرجع الأنظمة</title>

<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%231d3a6b'/%3E%3Cpath d='M16 6l8 4.5v9L16 24l-8-4.5v-9z' fill='none' stroke='%23fff' stroke-width='1.8' stroke-linejoin='round'/%3E%3Cpath d='M8 10.5l8 4.5 8-4.5M16 24v-9' fill='none' stroke='%23c8161d' stroke-width='1.8' stroke-linejoin='round'/%3E%3C/svg%3E">

<!-- تطبيق السمة قبل أول رسم لتفادي الوميض -->
<script>
(function () {
  try {
    var raw = localStorage.getItem("onyx.v1.themePref");
    var pref = raw ? JSON.parse(raw) : "system";
    var dark = pref === "dark" ||
      (pref === "system" && window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches);
    document.documentElement.setAttribute("data-theme", dark ? "dark" : "light");
    var d = localStorage.getItem("onyx.v1.density");
    document.documentElement.setAttribute("data-density", d ? JSON.parse(d) : "comfortable");
  } catch (e) {}
})();
</script>

<link rel="stylesheet" href="assets/css/tokens.css">
<link rel="stylesheet" href="assets/css/base.css">
<link rel="stylesheet" href="assets/css/layout.css">
<link rel="stylesheet" href="assets/css/components.css">
<link rel="stylesheet" href="assets/css/tree.css">
<link rel="stylesheet" href="assets/css/palette.css">
<link rel="stylesheet" href="assets/css/views.css">
</head>

<body>
<div class="app" id="app" data-rail="collapsed">

  <!-- ═══════════ الشريط العلوي ═══════════ -->
  <header class="topbar">
    <button type="button" class="btn btn--icon" id="railToggle" aria-label="طيّ / توسيع شريط الأنظمة">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
           stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>

    <div class="topbar__brand">
      <div class="brand-mark">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="m12 3 8 4.5v9L12 21l-8-4.5v-9z"/><path d="m4 7.5 8 4.5 8-4.5M12 21v-9"/>
        </svg>
      </div>
      <div class="brand-text">
        <b>بتروسبيشل</b>
        <span>ONYX ERP</span>
      </div>
    </div>

    <div class="topbar__spacer"></div>

    <button type="button" class="search-trigger" id="searchTrigger" aria-label="بحث في كل الشاشات">
      <svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor"
           stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <span class="search-trigger__label">ابحث عن شاشة، حساب، أو إعداد…</span>
      <span class="kbd">Ctrl K</span>
    </button>

    <div class="topbar__spacer"></div>

    <div class="topbar__actions">
      <button type="button" class="btn btn--icon" id="themeBtn" aria-label="تبديل السمة"></button>
      <button type="button" class="btn btn--icon" id="bellBtn" aria-label="التنبيهات">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round">
          <path d="M6 9a6 6 0 0 1 12 0c0 5 2 6 2 6H4s2-1 2-6"/><path d="M10.5 20a2 2 0 0 0 3 0"/>
        </svg>
      </button>
      <div class="topbar__divider"></div>
      <span class="pill pill--muted">١ - عربى</span>
      <button type="button" class="btn btn--icon" id="userBtn" aria-label="المستخدم والإعدادات">
        <svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75"
             stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="8" r="3.5"/><path d="M5 20c1.2-3.5 4-5 7-5s5.8 1.5 7 5"/>
        </svg>
      </button>
    </div>
  </header>

  <!-- ═══════════ شريط الأنظمة ═══════════ -->
  <nav class="rail" aria-label="الأنظمة">
    <div class="rail__scroll" id="railScroll" role="tablist" aria-orientation="vertical"></div>
  </nav>

  <!-- ═══════════ منطقة العمل ═══════════ -->
  <div class="body" id="appBody">

    <!-- لوحة الشجرة -->
    <aside class="treepane" aria-label="شجرة النظام">
      <div class="resizer" id="resizer" role="separator" aria-orientation="vertical"
           aria-label="تغيير عرض لوحة الشجرة" tabindex="0"></div>

      <div class="treepane__head">
        <div class="treepane__title" id="treeTitle"></div>

        <div class="segmented" id="treeSeg" role="tablist" aria-label="عرض اللوحة">
          <button type="button" role="tab" data-mode="tree" aria-selected="true">شجرة النظام</button>
          <button type="button" role="tab" data-mode="fav" aria-selected="false">المفضلة</button>
          <button type="button" role="tab" data-mode="recent" aria-selected="false">الأخيرة</button>
        </div>

        <div class="field">
          <svg class="icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor"
               stroke-width="1.75" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
          <input type="text" id="treeSearch" placeholder="بحث في الشجرة…" autocomplete="off" spellcheck="false"
                 aria-label="بحث في شجرة النظام">
          <span class="searchcount" id="searchCount" aria-live="polite"></span>
          <button type="button" class="btn btn--icon btn--sm" id="searchClear" aria-label="مسح البحث">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                 stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>
          </button>
        </div>

        <div class="treepane__tools" id="treeTools">
          <button type="button" class="btn btn--sm" id="btnExpandAll" title="فتح كل التفريعات">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 15v5h-5M15 4h5v5M9 20H4v-5"/></svg>
            <span>فتح الكل</span>
          </button>
          <button type="button" class="btn btn--sm" id="btnCollapseAll" title="طيّ كل التفريعات">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9"
                 stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 20v-5h5M4 15h5v5M20 9h-5V4"/></svg>
            <span>طيّ الكل</span>
          </button>
          <span style="flex:1"></span>
          <button type="button" class="btn btn--icon btn--sm" id="btnTreeMore" aria-label="خيارات إضافية">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"
                 stroke-linecap="round"><circle cx="6" cy="12" r=".6"/><circle cx="12" cy="12" r=".6"/><circle cx="18" cy="12" r=".6"/></svg>
          </button>
        </div>
      </div>

      <div class="treepane__scroll" id="treeScroll"></div>
    </aside>

    <!-- المحتوى -->
    <main class="main" id="mainScroll">
      <div class="main__inner" id="mainInner"></div>
    </main>
  </div>

  <!-- ═══════════ شريط الحالة ═══════════ -->
  <footer class="statusbar">
    <div class="statusbar__left">
      <span class="dot"></span>
      <span id="statusText" class="truncate">جاهز</span>
    </div>
    <div class="statusbar__right">
      <span>وضع العرض التوضيحي — بدون تنفيذ عمليات فعلية</span>
    </div>
  </footer>

</div>

<!-- ═══════════ السكربتات (بالترتيب) ═══════════ -->

<script src="assets/js/store.js"></script>

</body>
</html>
